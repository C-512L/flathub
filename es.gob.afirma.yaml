app-id: es.gob.afirma
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk25
command: autofirma
finish-args:
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  # Autofirma only checks legacy NSS db location for now.
  # TODO: Support XDG Base Directory for NSS db
  - --filesystem=~/.pki/nssdb
  # TODO: Implement XDG Base Directory support
  - --persist=.afirma
  - --persist=.java
  - --socket=x11
  - --share=ipc
  - --share=network
  - --socket=pcsc
  - --env=PATH=/usr/bin:/app/bin:/app/jre/bin
  - --env=INSTALL_PREFIX=/app
  - --env=AUTOFIRMA_AVOID_UPDATE_CHECK=true
cleanup:
  - /bin/pcsc-spy
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - '*.la'
  - '*.a'
modules:
  - name: libpcsclite
    buildsystem: meson
    config-opts:
      - -Dlibsystemd=false
      - -Dpolkit=false
      - -Dlibudev=false
      - -Dusb=false
      - -Dserial=false
    post-install:
      - rm /app/sbin/pcscd
      - rmdir /app/sbin || true
    cleanup:
      - /lib/libpcscspy.so
      - /lib/libpcscspy.so.0
    sources:
      - type: git
        url: "https://github.com/LudovicRousseau/PCSC.git"
        tag: '2.4.1'
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk25/install.sh
      - install -Dm755 /usr/bin/certutil ${FLATPAK_DEST}/bin/certutil
  - name: autofirma
    buildsystem: simple
    build-options:
      env:
        PATH: ${PATH}:/app/bin:/usr/bin:/usr/lib/sdk/openjdk25/bin
        MAVEN_OPTS: -Dmaven.test.skip=true -Dmaven.repo.local=.m2/repository
        JAVA_HOME: /usr/lib/sdk/openjdk25/jvm/openjdk-25/
    build-commands:
      # Offline maven build (-o)
      - mvn clean package -o -B -T 1C -P env-install
      - install -Dm 0755 afirma-simple/target/autofirma.jar /app/lib/Autofirma/autofirma.jar
      - install -Dm 0644 afirma-ui-simple-configurator/target/autofirmaConfigurador.jar /app/lib/Autofirma/autofirmaConfigurador.jar
      # Launch script
      - install -Dm 0755 afirma-simple-installer/linux/common/bin/autofirma /app/bin/autofirma
      # SVG icon (scalable)
      - install -Dm 0644 afirma-simple-installer/linux/common/usr/share/icons/hicolor/scalable/icon.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      # Desktop file
      - sed -i -e "s/@APP_ID@/${FLATPAK_ID}/g" afirma-simple-installer/linux/common/usr/share/applications/launcher.desktop.in
      - install -Dm 0644 afirma-simple-installer/linux/common/usr/share/applications/launcher.desktop.in /app/share/applications/${FLATPAK_ID}.desktop
      # AppStream
      - sed -i -e "s/@APP_ID@/${FLATPAK_ID}/g" afirma-simple-installer/linux/common/usr/share/metainfo/metainfo.xml.in
      - install -Dm 0644 afirma-simple-installer/linux/common/usr/share/metainfo/metainfo.xml.in /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: git
        url: https://github.com/ctt-gob-es/clienteafirma.git
        commit: d3d039512d4adb7ac0d67e9e3d1ce6024b2efd88
      - type: patch
        use-git: true
        paths: 
          - patches/273847be49ebd42bd6a56fd31ca96f777ee14491.patch
          - patches/2ca9b989556ce280d06a2640b63d45a655351f41.patch
          - patches/8f5723b95aac04154f7792054ce40b1f2a82dea7.patch
          - patches/a58af70d2e784dc4ecfe6ca524240f3c88aab6b8.patch
          - patches/desktop-file.patch
          - patches/desktop-icon.patch
          - patches/launch-script.patch
          - patches/metainfo.patch
          - patches/pom.patch
      - maven-dependencies.yaml
